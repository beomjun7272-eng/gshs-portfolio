<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>과학고등학교 되기 위한 꿀팁</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>
:root{--black:#080808;--white:#f7f7f8;--muted:#8b8b91;--line:#28282c;--accent:#2c73f6;--lime:#d8ff39}*{box-sizing:border-box}html{background:var(--black);scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--white);font-family:"Noto Sans KR",Arial,sans-serif;letter-spacing:-.045em}.top{height:67px;padding:0 clamp(20px,4.5vw,66px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:900;letter-spacing:-.08em}.brand b{color:var(--accent)}.status{color:#b4b4b8;font:12px "DM Mono",monospace;letter-spacing:0}.status:before{content:"";display:inline-block;width:7px;height:7px;background:var(--lime);border-radius:50%;margin-right:8px}main{padding:0 clamp(20px,4.5vw,66px)}.intro{min-height:calc(100vh - 67px);display:flex;flex-direction:column;justify-content:center;padding:74px 0 68px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 25px;color:var(--lime);font:13px "DM Mono",monospace;letter-spacing:.05em}h1{max-width:1070px;margin:0;font-size:clamp(3.25rem,8.5vw,8.8rem);font-weight:900;line-height:1.03;letter-spacing:-.09em;word-break:keep-all}.blue{color:var(--accent)}.blinker{display:inline-block;width:.1em;height:.85em;background:var(--lime);margin-left:.08em;vertical-align:-.04em;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}.lead{min-height:4.7em;max-width:610px;margin:38px 0 0;color:#b6b6bb;font-size:clamp(1.05rem,1.8vw,1.35rem);line-height:1.75;word-break:keep-all}.scroll{margin-top:64px;color:#73737b;font:11px "DM Mono",monospace;letter-spacing:.04em}.scroll span{color:var(--lime);margin-left:8px}.header{padding:105px 0 30px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line)}h2{margin:0;font-size:clamp(2rem,4vw,4.35rem);font-weight:900;line-height:1.1;letter-spacing:-.075em}.count{color:var(--muted);font:13px "DM Mono",monospace;letter-spacing:0}.tip{display:grid;grid-template-columns:108px minmax(0,1.1fr) minmax(220px,.7fr);gap:24px;padding:36px 0 39px;border-bottom:1px solid var(--line);transition:background .2s}.tip:hover{background:linear-gradient(90deg,rgba(44,115,246,.08),transparent 65%)}.index{color:var(--accent);font:13px "DM Mono",monospace;letter-spacing:0}h3{margin:0;min-height:1.35em;font-size:clamp(1.58rem,3vw,3rem);font-weight:800;line-height:1.2;letter-spacing:-.065em;word-break:keep-all}.detail{min-height:5em;margin:0;color:#aaaab0;font-size:1rem;line-height:1.7;word-break:keep-all}.finish{padding:137px 0 86px}.finish .eyebrow{margin-bottom:20px}.finish h2{max-width:900px;font-size:clamp(2.6rem,6.8vw,6.7rem)}.finish h2 strong{color:var(--lime);font-weight:900}footer{display:flex;justify-content:space-between;gap:12px;padding:22px 0 28px;border-top:1px solid var(--line);color:#717177;font:11px "DM Mono",monospace;letter-spacing:0}[data-type]{visibility:hidden}[data-type].ready{visibility:visible}.cursor-inline:after{content:"_";color:var(--lime);margin-left:3px;animation:blink .7s steps(1) infinite}@media(max-width:720px){.intro{min-height:610px;padding:70px 0 55px}.header{padding-top:76px}.tip{grid-template-columns:55px 1fr;gap:13px}.detail{grid-column:2}.finish{padding:92px 0 70px}.status{font-size:10px}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){.blinker,.cursor-inline:after{animation:none}[data-type]{visibility:visible}}
 .tip{display:block;padding:0}.tip-button{width:100%;padding:36px 0 34px;display:grid;grid-template-columns:108px minmax(0,1fr) 42px;gap:24px;align-items:center;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit}.tip-button:focus-visible{outline:2px solid var(--lime);outline-offset:-4px}.tip h3{font:inherit;font-size:clamp(1.58rem,3vw,3rem);font-weight:800;line-height:1.2;letter-spacing:-.065em}.plus{justify-self:end;position:relative;width:28px;height:28px;border:1px solid #68686f;border-radius:50%;transition:transform .25s,border-color .25s}.plus:before,.plus:after{content:"";position:absolute;left:7px;right:7px;top:13px;height:1px;background:#e8e8ea}.plus:after{transform:rotate(90deg);transition:transform .25s}.tip.open{background:linear-gradient(90deg,rgba(44,115,246,.08),transparent 65%)}.tip.open .plus{border-color:var(--lime);transform:rotate(90deg)}.tip.open .plus:after{transform:rotate(0)}.tip-panel{display:grid;grid-template-columns:108px minmax(0,1fr) minmax(220px,.7fr);gap:24px;max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .25s}.tip.open .tip-panel{max-height:290px;opacity:1}.detail{grid-column:3;padding:0 0 37px;min-height:0}.science-icon{width:clamp(34px,5vw,62px);height:clamp(34px,5vw,62px);margin:0 0 18px;color:var(--lime);stroke-width:1.35}@media(max-width:720px){.tip-button{grid-template-columns:55px 1fr 34px;gap:13px;padding:28px 0}.tip-panel{grid-template-columns:55px 1fr;gap:13px}.detail{grid-column:2;padding:0 0 28px}.tip.open .tip-panel{max-height:340px}}
</style></head><body><header class="top"><div class="brand">SCI<span>b</span> LOG</div><div class="status">SCIENCE HIGH PREP / 2026</div></header><main><section class="intro"><p class="eyebrow" data-type="01 — THE START OF YOUR RESEARCH"></p><h1><span data-type="과학고등학교를"></span><br><span class="blue" data-type="꿈꾸고 있다면"></span><span class="blinker"></span></h1><p class="lead" data-type="정답을 빨리 찾는 사람보다, 좋은 질문을 오래 붙잡는 사람이 더 멀리 갑니다. 오늘부터 시작할 수 있는 준비를 모았습니다."></p><p class="scroll" data-type="SCROLL TO EXPLORE"><span>↓</span></p></section><section><div class="header"><h2 data-type="합격에 가까워지는&lt;br&gt;4가지 습관"></h2><span class="count" data-type="04 TIPS"></span></div>
<style>:root{--white:#67f7ff;--muted:#788cff;--line:#263b6c;--accent:#3f7cff;--lime:#c9ff32}body{color:#67f7ff}.status{color:#8ea7ff}.lead{color:#83a7f5}.detail{color:#8bb2ff}.plus:before,.plus:after{background:#c9ff32}.finish h2{color:#67f7ff}footer{color:#6c87cf}</style><script>document.querySelector('.header h2').dataset.type='합격에 가까워지는 4가지 습관';</script>
<article class="tip"><button class="tip-button" aria-expanded="false"><span class="index" data-type="01 / 04"></span><h3 data-type="개념을 내 언어로 설명하기"></h3><span class="plus" aria-hidden="true"></span></button><div class="tip-panel"><p class="detail" data-detail="문제를 많이 푸는 것보다 중요한 건 ‘왜’ 답이 되는지 말할 수 있는 힘이에요. 교과서 한 단원을 친구에게 가르치듯 정리해보세요."></p></div></article>
<article class="tip"><button class="tip-button" aria-expanded="false"><span class="index" data-type="02 / 04"></span><h3 data-type="궁금증을 기록하기"></h3><span class="plus" aria-hidden="true"></span></button><div class="tip-panel"><p class="detail" data-detail="수업 중 떠오른 질문, 일상 속 이상한 현상을 메모하세요. 작고 사소한 의문이 면접에서 빛나는 나만의 탐구 이야기가 됩니다."></p></div></article>
<article class="tip"><button class="tip-button" aria-expanded="false"><span class="index" data-type="03 / 04"></span><h3 data-type="과정을 남기는 탐구하기"></h3><span class="plus" aria-hidden="true"></span></button><div class="tip-panel"><p class="detail" data-detail="성공한 실험만 기록하지 마세요. 가설을 바꾸고 실패 원인을 찾은 과정까지 남겨야 진짜 탐구력이 쌓입니다."></p></div></article>
<article class="tip"><button class="tip-button" aria-expanded="false"><span class="index" data-type="04 / 04"></span><h3 data-type="진짜 나의 언어로 말하기"></h3><span class="plus" aria-hidden="true"></span></button><div class="tip-panel"><p class="detail" data-detail="화려한 경험을 외우는 대신, 내가 무엇에 설렜고 무엇을 배웠는지 솔직하게 정리하세요. 가장 설득력 있는 답은 늘 자기 경험에서 나옵니다."></p></div></article>
<style>.tip-panel{display:block}.detail{max-width:760px;margin:0 auto;text-align:center;padding:10px 24px 42px;font-size:clamp(1.2rem,2.3vw,1.6rem);line-height:1.9}.tip.open .tip-panel{max-height:340px}</style></section><section class="finish"><i data-lucide="flask-conical" class="science-icon" aria-label="과학 실험 플라스크"></i><p class="eyebrow" data-type="작은 질문 하나가 새로운 탐구를 시작합니다"></p><h2 data-type="완벽함보다 호기심을 더 오래 지켜보세요."></h2></section><footer><span data-type="과학고등학교 준비 가이드"></span><span data-type="작게 시작하고, 꾸준히 탐구하세요."></span></footer></main><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script><script>
lucide.createIcons();const items=[...document.querySelectorAll('[data-type]')],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,ms));async function type(el,text=el.dataset.type){el.classList.add('ready');if(reduced){el.innerHTML=text;return}for(let i=0;i<text.length;i++){el.innerHTML+=text[i];await wait(text[i]===' '?20:24)}el.classList.add('cursor-inline');await wait(100);el.classList.remove('cursor-inline')}async function start(){for(const item of items)await type(item)}start();document.querySelectorAll('.tip-button').forEach(button=>button.addEventListener('click',async()=>{const tip=button.closest('.tip'),opening=!tip.classList.contains('open');document.querySelectorAll('.tip.open').forEach(open=>{open.classList.remove('open');open.querySelector('button').setAttribute('aria-expanded','false')});if(!opening)return;tip.classList.add('open');button.setAttribute('aria-expanded','true');const detail=tip.querySelector('[data-detail]');if(!detail.dataset.done){await type(detail,detail.dataset.detail);detail.dataset.done='true'}}));
</script></body></html>
