<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영단어 퀴즈 서바이벌 게임</title>
  <style>
    :root { --cyan:#00d9ff; --violet:#a45cff; --ink:#070b24; --card:#101837e8; --muted:#aeb8d4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; background:radial-gradient(circle at 16% 5%,#402361 0,transparent 34%),radial-gradient(circle at 86% 62%,#013f58 0,transparent 33%),linear-gradient(115deg,#121233,#061328); color:#f7f9ff; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22; background-image:linear-gradient(#6675ae44 1px,transparent 1px),linear-gradient(90deg,#6675ae44 1px,transparent 1px); background-size:60px 60px; mask-image:linear-gradient(to bottom,black,transparent); }
    #app { min-height:100vh; display:grid; place-items:center; padding:28px 20px; position:relative; }
    .screen { width:min(960px,100%); text-align:center; animation:enter .55s ease-out; }
    .hidden { display:none!important; }
    .eyebrow,.stat-label { color:#ad9ac8; letter-spacing:.38em; font-size:13px; font-weight:750; }
    h1 { margin:20px auto 18px; color:var(--cyan); font-size:clamp(42px,7.2vw,78px); line-height:1.16; letter-spacing:.06em; text-shadow:0 0 10px #00d9ffcc,0 0 34px #00bde888; max-width:820px; }
    .subtitle { color:#b8c3dd; font-size:clamp(17px,2vw,25px); margin:0 0 64px; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .start { width:min(590px,100%); min-height:110px; border-radius:26px; border:1px solid #10c8e8; background:linear-gradient(110deg,#155878cc,#352568cc); box-shadow:0 0 26px #00cbeb77,inset 0 0 24px #83e8ff22; font-size:clamp(23px,3vw,37px); font-weight:850; letter-spacing:.03em; transition:.2s transform,.2s filter; }
    .start:hover,.answer:hover { transform:translateY(-3px); filter:brightness(1.18); }
    .play { color:white; margin-right:18px; }
    .best-home { margin:27px 0 0; color:#b6c0d9; font-size:14px; }
    .best-home strong { display:block; color:white; font-size:25px; margin-top:6px; }
    .hud { margin:0 auto 21px; padding:19px 25px; border:1px solid #087d9b; border-radius:28px; display:flex; align-items:center; gap:38px; text-align:left; background:#0d1534b8; box-shadow:0 0 27px #00c8eb21; }
    .stat { min-width:52px; }.stat-label { display:block; font-size:12px; color:#9fa9c5; }.stat-value { display:block; font-size:27px; font-weight:850; margin-top:5px; }.score { color:var(--cyan); }.combo { color:var(--violet); }
    .timer-wrap { height:18px; border-radius:99px; overflow:hidden; background:#15143d; margin:0 2px 77px; border:1px solid #353064; }
    .timer { height:100%; width:100%; border-radius:inherit; background:linear-gradient(90deg,#f13945,#ff8a4e); box-shadow:0 0 16px #f14e50; transition:width .08s linear; }
    .quiz-card { border:1px solid #087d9b; border-radius:31px; padding:clamp(45px,7vw,78px) 25px; min-height:285px; display:grid; place-items:center; background:linear-gradient(135deg,#121a3ddd,#07152ddd); box-shadow:0 0 35px #00c7ee1c; }
    .prompt { color:#aeb9d2; font-size:17px; letter-spacing:.27em; margin:0 0 22px; }.meaning { margin:0; color:var(--cyan); text-shadow:0 0 15px #00d9ffbb; font-size:clamp(38px,6.2vw,70px); letter-spacing:.08em; }
    .answers { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:37px; }.answer { min-height:115px; border:1px solid #02bedf; border-radius:24px; background:linear-gradient(110deg,#104661c9,#292158c9); box-shadow:0 0 22px #00d1f044; font-weight:800; font-size:clamp(21px,3vw,31px); padding:12px; }.key { color:#9eeeff; display:block; font-size:13px; letter-spacing:.12em; margin-bottom:8px; }.help { color:#a8b4ce; font-size:14px; margin:22px 0 0; }
    .result-card { border:1px solid #0d9fbc; border-radius:32px; padding:56px 25px; background:#0c1635e8; box-shadow:0 0 45px #00d9ff35; }.result-card h2 { color:var(--cyan); text-shadow:0 0 20px #00d9ff99; font-size:clamp(35px,6vw,65px); margin:0 0 12px; }.result-card p { color:#b5c1dc; font-size:20px; }.final-score { font-size:64px; color:#fff; font-weight:900; margin:20px; }.retry { margin-top:18px; min-height:66px; padding:0 46px; border:1px solid var(--cyan); border-radius:17px; background:#123b5a; font-weight:800; font-size:20px; }
    .correct { border-color:#5dff9b!important; background:#155b4ad9!important; }.wrong { border-color:#ff5d71!important; background:#6a233cd9!important; }
    @keyframes enter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    @media (max-width:620px) { #app { padding:19px 14px; } .subtitle { margin-bottom:43px; } .hud { gap:17px; padding:15px; border-radius:21px; justify-content:space-between; }.stat-label { letter-spacing:.17em; font-size:10px; }.stat-value { font-size:21px; }.timer-wrap { margin-bottom:38px; }.quiz-card { min-height:230px; padding:38px 14px; }.answers { grid-template-columns:1fr; margin-top:22px; }.answer { min-height:80px; }.help { margin-top:16px; } }
  </style>
</head>
<body>
  <main id="app">
    <section id="home" class="screen">
      <p class="eyebrow">SURVIVAL MODE</p>
      <h1>영단어 퀴즈 서바이벌 게임</h1>
      <p class="subtitle">5초 안에 올바른 뜻을 선택하여 생존하세요!</p>
      <button class="start" id="start"><span class="play">▶</span>게임 시작 (START GAME)</button>
      <p class="best-home">최고 점수<strong id="home-best">0</strong></p>
    </section>
    <section id="game" class="screen hidden" aria-live="polite">
      <div class="hud">
        <div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value score" id="score">0</strong></div>
        <div class="stat"><span class="stat-label">WAVE</span><strong class="stat-value" id="wave">1</strong></div>
        <div class="stat"><span class="stat-label">COMBO</span><strong class="stat-value combo" id="combo">0</strong></div>
        <div class="stat"><span class="stat-label">BEST</span><strong class="stat-value" id="best">0</strong></div>
      </div>
      <div class="timer-wrap"><div class="timer" id="timer"></div></div>
      <div class="quiz-card"><div><p class="prompt">영단어를 고르세요</p><h2 class="meaning" id="meaning"></h2></div></div>
      <div class="answers"><button class="answer" id="left"><span class="key">◀ LEFT</span><span></span></button><button class="answer" id="right"><span class="key">RIGHT ▶</span><span></span></button></div>
      <p class="help">← / → 키로도 선택할 수 있습니다</p>
    </section>
    <section id="result" class="screen hidden"><div class="result-card"><p class="eyebrow">GAME OVER</p><h2 id="result-title">생존 종료</h2><p id="result-copy">다시 도전해 보세요.</p><div class="final-score" id="final-score">0</div><button class="retry" id="retry">다시 시작</button></div></section>
  </main>
  <script>
    (() => {
      const words = [
        ['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회'],['Consider','고려하다'],['Essential','필수적인'],['Improve','개선하다'],['Challenge','도전'],['Knowledge','지식'],['Responsible','책임감 있는'],['Develop','발전시키다'],['Benefit','혜택']
      ];
      const $ = id => document.getElementById(id);
      let score=0, combo=0, wave=1, index=0, answerSide=0, deadline=0, raf=0, active=false;
      let best = +localStorage.getItem('vocab-survival-best') || 0;
      const updateBest=()=>{ $('best').textContent=best; $('home-best').textContent=best; };
      function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }
      function render(){
        const current=words[index % words.length], decoys=shuffle(words.filter(w=>w!==current)).slice(0,1);
        answerSide=Math.random()<.5?0:1; const choices=answerSide?[decoys[0][0],current[0]]:[current[0],decoys[0][0]];
        $('meaning').textContent=current[1]; $('left').lastElementChild.textContent=choices[0]; $('right').lastElementChild.textContent=choices[1];
        $('score').textContent=score; $('combo').textContent=combo; $('wave').textContent=wave;
        $('left').className='answer'; $('right').className='answer'; deadline=performance.now()+5000; tick();
      }
      function tick(){ if(!active)return; const remain=Math.max(0,deadline-performance.now()); $('timer').style.width=(remain/50)+'%'; if(remain<=0){ end(false,'시간 초과!'); return; } raf=requestAnimationFrame(tick); }
      function choose(side){ if(!active)return; cancelAnimationFrame(raf); const correct=side===answerSide, button=side?$('right'):$('left'); button.classList.add(correct?'correct':'wrong'); active=false; setTimeout(()=>{ if(!correct){end(false,'오답입니다!');return;} combo++; score+=100+(combo-1)*25; wave=Math.floor(score/500)+1; index++; active=true; render(); },400); }
      function begin(){ score=0;combo=0;wave=1;index=0; $('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');active=true;render(); }
      function end(success,message){ active=false; cancelAnimationFrame(raf); if(score>best){best=score;localStorage.setItem('vocab-survival-best',best);} updateBest(); $('game').classList.add('hidden');$('result').classList.remove('hidden');$('result-title').textContent=message;$('result-copy').textContent=`WAVE ${wave} · 최고 콤보 ${combo}`;$('final-score').textContent=score; }
      $('start').addEventListener('click',begin);$('retry').addEventListener('click',begin);$('left').addEventListener('click',()=>choose(0));$('right').addEventListener('click',()=>choose(1));
      addEventListener('keydown',e=>{ if(!active&&(e.code==='Space'||e.code==='Enter')){ e.preventDefault(); if(!$('home').classList.contains('hidden')||!$('result').classList.contains('hidden'))begin(); } if(active&&e.key==='ArrowLeft')choose(0);if(active&&e.key==='ArrowRight')choose(1); }); updateBest();
    })();
  </script>
</body>
</html>
