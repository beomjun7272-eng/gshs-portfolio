<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경남과학고 입학 도우미</title>
  <style>
    :root { --kakao:#fee500; --ink:#242424; --paper:#b9d5ed; --bot:#fff; --user:#fee500; --line:#dce5ed; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#eff6fb,#dfeefa); color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    .app { width:min(100%,760px); height:min(100vh,820px); min-height:620px; display:flex; flex-direction:column; overflow:hidden; background:var(--paper); box-shadow:0 18px 55px #40627a35; }
    .topbar { height:70px; padding:14px 20px; display:flex; align-items:center; gap:12px; background:#fff; border-bottom:1px solid #d6e0e8; }
    .avatar { width:40px; height:40px; display:grid; place-items:center; border-radius:15px; background:var(--kakao); font-size:21px; }
    .title { font-size:16px; font-weight:800; }
    .status { margin-top:3px; color:#6d7882; font-size:12px; }
    .chat { flex:1; overflow-y:auto; padding:22px 18px 18px; }
    .notice { width:max-content; max-width:95%; margin:0 auto 18px; padding:7px 11px; border-radius:14px; color:#557084; background:#a9cae2; font-size:11px; line-height:1.45; text-align:center; }
    .row { display:flex; align-items:flex-end; gap:8px; margin:12px 0; }
    .row.user { justify-content:flex-end; }
    .bot-icon { width:31px; height:31px; flex:0 0 31px; display:grid; place-items:center; border-radius:12px; background:var(--kakao); font-size:16px; }
    .bubble { max-width:min(79%,560px); padding:11px 13px; border-radius:4px 16px 16px; background:var(--bot); font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:keep-all; box-shadow:0 1px 1px #5b79901a; }
    .user .bubble { border-radius:16px 4px 16px 16px; background:var(--user); }
    .time { flex:0 0 auto; color:#668095; font-size:10px; }
    .typing::after { content:""; display:inline-block; width:5px; height:15px; margin-left:2px; background:#45545f; vertical-align:-2px; animation:blink .8s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .suggestions { padding:12px 16px 10px; background:#fff; border-top:1px solid var(--line); }
    .suggestion-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
    .suggestion-head span { color:#64727d; font-size:12px; font-weight:700; }
    .refresh { border:0; padding:6px 9px; border-radius:9px; background:#f0f3f6; color:#42515d; font:inherit; font-size:12px; cursor:pointer; }
    .questions { display:flex; flex-wrap:wrap; gap:7px; }
    .question { max-width:100%; padding:8px 10px; border:1px solid #e2e7eb; border-radius:16px; background:#fff; color:#384650; font:inherit; font-size:12px; line-height:1.25; text-align:left; cursor:pointer; transition:.15s; }
    .question:hover { border-color:#f0ce00; background:#fffbed; transform:translateY(-1px); }
    .question:disabled,.refresh:disabled { cursor:not-allowed; opacity:.55; transform:none; }
    .footnote { padding-top:8px; color:#8a969e; font-size:10px; text-align:center; }
    .composer { display:flex; align-items:flex-end; gap:8px; padding:10px 14px 13px; background:#fff; border-top:1px solid #edf0f2; }
    .message-input { flex:1; min-width:0; min-height:40px; max-height:104px; padding:10px 12px; resize:none; overflow-y:auto; border:1px solid #d8e0e5; border-radius:18px; outline:none; color:var(--ink); font:inherit; font-size:13px; line-height:1.45; }
    .message-input:focus { border-color:#e1bd00; box-shadow:0 0 0 3px #fee50038; }
    .send { width:40px; height:40px; flex:0 0 40px; border:0; border-radius:14px; background:#fee500; color:#3e3500; font-size:18px; cursor:pointer; transition:.15s; }
    .send:hover:not(:disabled) { filter:brightness(.96); transform:translateY(-1px); }
    .send:disabled { background:#ebeff2; color:#a5afb6; cursor:not-allowed; }
    @media (max-width:760px) { body { display:block; } .app { height:100vh; min-height:0; } .topbar { height:64px; } .chat { padding:18px 13px; } .suggestions { padding:11px 12px; } .bubble { max-width:82%; font-size:13px; } }
  </style>
</head>
<body>
  <main class="app" aria-label="경남과학고 입학 FAQ 챗봇">
    <header class="topbar"><div class="avatar" aria-hidden="true">🔬</div><div><div class="title">경남과학고 입학 도우미</div><div class="status">FAQ 기반 안내 · 온라인</div></div></header>
    <section class="chat" id="chat" aria-live="polite">
      <div class="notice">2027학년도 전형요강(안) 기반 안내입니다.<br>지원 전에는 반드시 학교의 최종 공지를 확인하세요.</div>
    </section>
    <section class="suggestions" aria-label="추천 질문">
      <div class="suggestion-head"><span>궁금한 질문을 골라보세요</span><button class="refresh" id="refresh" type="button">↻ 새 질문</button></div>
      <div class="questions" id="questions"></div>
      <div class="footnote">답변은 대화창에 계속 쌓입니다.</div>
    </section>
    <form class="composer" id="composer">
      <textarea class="message-input" id="messageInput" rows="1" maxlength="500" placeholder="궁금한 점을 직접 입력해 보세요" aria-label="메시지 입력"></textarea>
      <button class="send" id="send" type="submit" aria-label="메시지 전송">➤</button>
    </form>
  </main>
  <script>
    const faq = [
      ['경남과학고는 어떤 학생을 찾나요?', '수학·과학·정보 분야에 높은 열정과 성장 가능성, 잠재력이 있고 본교 수학에 필요한 기초 학업 역량을 갖춘 학생을 찾습니다. 영상에서는 근면·자율·탐구의 태도와 주도성을 강조합니다.'],
      ['모집 인원은 몇 명인가요?', '보통과 남녀공학 5학급, 총 100명입니다. 일반전형 80명, 사회통합전형 20명이며, 교육지원대상자와 특례입학대상자는 각 3명 이내로 정원 외 선발이 가능합니다.'],
      ['모집 지역은 어디인가요?', '기본 모집 지역은 경상남도입니다. 전 가족이 경남에 거주하는 타 시도 중학교 졸업자 등은 개별 자격 요건에 따라 지원할 수 있습니다.'],
      ['경남 소재 중학교를 졸업하면 지원할 수 있나요?', '경상남도 소재 중학교 졸업(예정)자는 공통 자격을 충족하고 출신학교장의 추천을 받으면 지원 대상입니다. 졸업자는 원서접수일 현재 경남 거주 요건도 확인해야 합니다.'],
      ['타 시도 중학생도 지원할 수 있나요?', '전 가족이 경상남도에 실제 거주하고 주민등록 요건을 충족하면, 타 시도 중학교 졸업자·특성화중학교 졸업예정자 등도 지원 가능 범위에 포함됩니다.'],
      ['검정고시 합격자도 지원할 수 있나요?', '중학교 졸업학력 검정고시 합격자 등 동등 학력 인정자는 지원할 수 있습니다. 주민등록등본, 가족관계증명서, 최종학력 학교생활기록부 사본, 합격증·성적증명서 등을 준비해야 합니다.'],
      ['다른 전기모집 고등학교와 함께 지원할 수 있나요?', '아니요. 경남과학고 지원자는 전기모집을 하는 다른 학교에 이중 지원할 수 없고, 합격 후에는 다른 학교에도 지원할 수 없습니다.'],
      ['일반전형과 사회통합전형에 동시에 지원할 수 있나요?', '전형 간 복수 지원은 불가합니다. 다만 사회통합전형에서 탈락한 지원자는 일반전형 대상으로 전환해 전형할 수 있습니다.'],
      ['사회통합전형은 어떻게 구성되나요?', '사회통합전형 20명 중 기회균등전형 대상자를 50% 이상 우선 선발하고, 미충원 시 사회다양성전형 대상자로 선발할 수 있습니다.'],
      ['사회다양성전형은 소득 기준이 있나요?', '최근 6개월 건강보험료를 기준으로 가구원 수별 기준중위소득 160% 이하 여부를 판단합니다. 부모의 보험 가입 상태에 따라 서류를 각각 제출해야 할 수 있습니다.'],
      ['교육지원대상자 전형은 사회통합전형과 같이 지원할 수 있나요?', '교육지원대상자(국가유공자 자녀)는 정원 외 전형과 사회통합전형을 동시에 지원할 수 없습니다.'],
      ['원서는 언제, 어떻게 접수하나요?', '요강(안)에는 2026년 8월 24일 10시부터 8월 26일 14시까지로 제시되어 있습니다. 경상남도교육청 고입전형 지원 온라인시스템을 사용하며, 중학교 또는 교육지원청의 확인·전송 완료가 접수 처리 기준입니다.'],
      ['추천서는 누가 써야 하나요?', '재학 중인 학교의 수학·과학·정보 교과 담당 교사 1인이 작성합니다. 검정고시 합격자는 자신을 잘 아는 사람의 추천서를 받을 수 있습니다.'],
      ['추천서는 언제까지 입력하나요?', '요강(안)에는 2026년 8월 24일 10시부터 8월 27일 17시까지로 안내되어 있습니다. 최종 일정은 학교 공지로 재확인하세요.'],
      ['지원자는 모두 면접을 보나요?', '아닙니다. 지원자 전원이 서류평가를 받고, 약 250명을 소집면담 대상자로 선발한 뒤 약 160명을 면접 대상자로 선발하는 단계형 전형입니다.'],
      ['서류평가에서는 무엇을 보나요?', '학생부, 자기소개서, 추천서 등 제출서류를 개별적·총체적으로 평가해 학업 적성, 성장 가능성, 인성 등을 판단합니다.'],
      ['면접에서는 어떤 점을 보나요?', '제출서류와 면접평가를 통해 학업 적성·성장 가능성·인성을 종합 평가합니다. 탐구 과정과 자기주도성, 생각을 설명하는 힘을 준비하는 것이 좋습니다.'],
      ['3학년 2학기 성적도 반영되나요?', '면접 대상자에게는 3학년 2학기 수학·과학 성적을 추가 반영합니다. 요강(안)에는 1단계 교과성적평가 결과 80%, 3학년 2학기 성적 20%로 제시되어 있습니다.'],
      ['자기소개서 분량과 문항은 어떻게 되나요?', '전체 3,000자 이내입니다. 지원 계기·학습 및 진로 계획, 수학·과학(정보 포함) 자기주도 탐구, 관계·봉사, 성장과 변화를 준 책 2권 등을 작성합니다.'],
      ['자기소개서에 쓰면 안 되는 내용은 무엇인가요?', '공인어학시험·경시대회·수상 실적, 교외상, 논문·도서출간·특허, 해외활동, 부모의 직업·소득·직장, 장학금, 특정 대학·기관·강사명, 자격증, 교과 점수·석차, 영재교육원 이력, 출신학교·이름을 암시하는 내용 등은 배제 대상입니다.'],
      ['금지 내용을 쓰면 어떤 불이익이 있나요?', '일부 항목은 0점 처리되며, 항목에 따라 배점의 10~20% 감점이 적용될 수 있습니다. 허위·표절·대리 작성이 확인되면 불합격 또는 합격 취소가 될 수 있습니다.'],
      ['제출서류는 우편으로 보내야 하나요?', '요강(안)은 서류를 등기우편으로 제출하도록 안내하며, 2026년 8월 26일 우체국 소인까지 유효하다고 기재합니다. 온라인 시스템 완료 여부와 우편 마감일을 모두 확인하세요.'],
      ['전형료가 있나요?', '없습니다.'],
      ['합격자 발표와 예비소집은 언제인가요?', '요강(안)에는 최종 합격자 발표가 2026년 11월 30일 17시, 예비소집이 12월 28일로 제시되어 있습니다. 최종 일정은 학교 누리집에서 확인하세요.'],
      ['의·치·한·약·수의예 계열 진학을 생각해도 되나요?', '요강은 과학계열 특수목적고로서 해당 계열 진학은 적합하지 않다고 안내합니다. 지원할 경우 추천서·진로진학지도 미실시, 장학금·학교장상 추천 제외 등의 제한에 동의해야 합니다.'],
      ['경남과학고의 수업 분위기는 어떤가요?', '홍보영상 요약에 따르면 학생들은 발표와 토론에 주도적으로 참여하고, 수학·과학 전 분야의 심화 탐구·실험과 컴퓨터 프로그래밍을 수행합니다.'],
      ['공부 외 활동도 할 수 있나요?', '가능합니다. 영상은 쉬는 시간의 교류, 점심시간 축구와 악기 연주, 농구 연습, 팀 전략 회의 등 학업과 일상의 균형을 보여줍니다.'],
      ['시험과 대회는 어느 정도 있나요?', '국어·영어·수학·물리·화학·생물·지구과학 등의 중간·기말고사와 교내외 대회를 경험하는 환경으로 소개됩니다. 일정 관리와 꾸준한 학습 습관이 중요합니다.'],
      ['지금부터 가장 효과적으로 준비할 일은 무엇인가요?', '수학·과학·정보 수업에서 궁금한 점을 스스로 정해 탐구하고, 과정과 배운 점을 기록하세요. 그 기록을 바탕으로 자기소개서 사례를 정리하되 금지 항목은 피해야 합니다.'],
      ['최종적으로 어떤 태도가 가장 중요할까요?', '근면하게 꾸준히 공부하고, 자율적으로 질문·탐구하며, 결과뿐 아니라 성장 과정과 협업 태도를 보여주는 것이 중요합니다.']
    ];

    const chat = document.querySelector('#chat');
    const questions = document.querySelector('#questions');
    const refresh = document.querySelector('#refresh');
    const composer = document.querySelector('#composer');
    const messageInput = document.querySelector('#messageInput');
    const send = document.querySelector('#send');
    let typing = false;
    const clock = () => new Intl.DateTimeFormat('ko-KR', { hour:'2-digit', minute:'2-digit', hour12:true }).format(new Date());
    const scrollBottom = () => chat.scrollTo({ top:chat.scrollHeight, behavior:'smooth' });
    const shuffle = list => [...list].sort(() => Math.random() - .5);

    function addBubble(text, who, withTyping = false) {
      const row = document.createElement('div'); row.className = `row ${who}`;
      if (who === 'bot') { const icon = document.createElement('div'); icon.className = 'bot-icon'; icon.textContent = '🔬'; row.append(icon); }
      const bubble = document.createElement('div'); bubble.className = `bubble${withTyping ? ' typing' : ''}`; bubble.textContent = withTyping ? '' : text; row.append(bubble);
      const time = document.createElement('span'); time.className = 'time'; time.textContent = clock(); row.append(time);
      chat.append(row); scrollBottom();
      return bubble;
    }

    async function typeAnswer(answer) {
      typing = true; setControls(true);
      const bubble = addBubble('', 'bot', true);
      for (let i = 0; i < answer.length; i++) {
        bubble.textContent += answer[i];
        if (i % 3 === 0) { scrollBottom(); await new Promise(resolve => setTimeout(resolve, 12)); }
      }
      bubble.classList.remove('typing'); typing = false; setControls(false); scrollBottom();
    }

    function setControls(disabled) { document.querySelectorAll('.question').forEach(button => button.disabled = disabled); refresh.disabled = disabled; messageInput.disabled = disabled; send.disabled = disabled; }
    function renderQuestions() {
      questions.innerHTML = '';
      shuffle(faq).slice(0, 5).forEach(([question, answer]) => {
        const button = document.createElement('button'); button.className = 'question'; button.type = 'button'; button.textContent = question;
        button.addEventListener('click', async () => { if (typing) return; addBubble(question, 'user'); await new Promise(resolve => setTimeout(resolve, 250)); await typeAnswer(answer); });
        questions.append(button);
      });
    }
    refresh.addEventListener('click', renderQuestions);
    messageInput.addEventListener('input', () => { messageInput.style.height = 'auto'; messageInput.style.height = `${Math.min(messageInput.scrollHeight, 104)}px`; });
    messageInput.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); composer.requestSubmit(); } });
    composer.addEventListener('submit', async event => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message || typing) return;
      addBubble(message, 'user');
      messageInput.value = ''; messageInput.style.height = 'auto';
      // TODO: API 연결 시 아래 임시 답변 대신 fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message}) })를 호출하세요.
      await new Promise(resolve => setTimeout(resolve, 350));
